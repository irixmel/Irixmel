name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # раз в сутки, в 00:00 UTC
  workflow_dispatch:        # + запуск вручную из вкладки Actions
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # --- Базовые блоки ---
          base: header, activity, community, repositories, metadata
          plugin_introduction: yes

          # --- Ачивки (Pull Shark, Galaxy Brain и т.д.) ---
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed

          # --- Языки и код ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8

          # --- Привычки кодинга ---
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          # --- Календари активности ---
          plugin_calendar: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Прочая статистика ---
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_notable: yes
          plugin_people: yes
          plugin_people_size: 6
          plugin_topics: yes
          plugin_topics_limit: 8
          plugin_topics_mode: icons

          # --- Внешний вид ---
          config_timezone: Europe/Kyiv
          config_display: large
          config_animations: yes
          config_gemoji: img
          config_twemoji: yes
          config_base64: yes

          # --- Языки: красивая палитра под тёмный фон ---
          plugin_languages_colors: >-
            {
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "Python": "#6bd6a8",
              "C++": "#a26fdb",
              "HTML": "#e34c26",
              "CSS": "#7c5bd6"
            }
